# Builds MeyAudioPlayer for Windows (.exe installer + portable .exe) and Android (.apk)
# Runs on every push, or by hand from the Actions tab ("Run workflow").
# Push a tag like v1.0.0 to also publish the files as a GitHub Release.
name: Build MeyAudioPlayer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe + installer)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Use latest app page
        shell: bash
        run: cp ../app/index.html app/index.html
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: MeyAudioPlayer-Windows
          path: |
            desktop/dist/MeyAudioPlayer-Setup-*.exe
            desktop/dist/MeyAudioPlayer-*-portable.exe

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Point Gradle at the runner's Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Using Android SDK at $ANDROID_HOME"
      - name: Use latest app page
        run: cp ../app/index.html app/src/main/assets/index.html
      - name: Release keystore (optional, from repository secrets)
        env:
          KS_B64: ${{ secrets.MAP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/map-release.jks"
            echo "MAP_KEYSTORE=$RUNNER_TEMP/map-release.jks" >> "$GITHUB_ENV"
            echo "Using release keystore from secrets"
          else
            echo "No MAP_KEYSTORE_BASE64 secret - APK will be signed with a debug key"
          fi
      - name: Build APK
        env:
          MAP_KEYSTORE_PASSWORD: ${{ secrets.MAP_KEYSTORE_PASSWORD }}
          MAP_KEY_ALIAS: ${{ secrets.MAP_KEY_ALIAS }}
          MAP_KEY_PASSWORD: ${{ secrets.MAP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../MeyAudioPlayer-1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MeyAudioPlayer-Android
          path: MeyAudioPlayer-1.0.apk

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, android ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: MeyAudioPlayer ${{ github.ref_name }}
          body: MeyAudioPlayer (MAP) by Kamil - Windows installer, portable exe and Android APK.
          files: out/*
