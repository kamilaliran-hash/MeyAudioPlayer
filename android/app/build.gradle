plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kamil.meyaudioplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kamil.meyaudioplayer'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    def ksPath = System.getenv('MAP_KEYSTORE')
    def hasReleaseKey = ksPath != null && file(ksPath).exists()

    signingConfigs {
        // Cloud build passes a release keystore through environment variables.
        // Without one, the release APK is signed with the standard debug key
        // so it can still be installed on a phone.
        release {
            if (hasReleaseKey) {
                storeFile file(ksPath)
                storePassword System.getenv('MAP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MAP_KEY_ALIAS')
                keyPassword System.getenv('MAP_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
